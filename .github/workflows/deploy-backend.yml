name: Deploy Backend to Cloud Run

on:
  pull_request:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        working-directory: ./backend
        run: |
          gcloud run deploy bookscout-backend \
            --source . \
            --region europe-southwest1 \
            --allow-unauthenticated \
            --set-env-vars GOOGLE_BOOKS_API_KEY=${{ secrets.BACKEND_GOOGLE_BOOKS_API_KEY }},TELEGRAM_BOT_TOKEN=${{ secrets.BACKEND_TELEGRAM_BOT_TOKEN }},TELEGRAM_CHAT_ID=${{ secrets.BACKEND_TELEGRAM_CHAT_ID }}
