name: Android Release Build & Publish

on:
  workflow_run:
    workflows: ["Create Release"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy-android:
    name: Build & Deploy Signed Android AppBundle
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java JDK
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Create .env file
      - name: Create .env file
        working-directory: ./app
        env:
          ENABLE_LOGS: ${{ secrets.APP_ENABLE_LOGS }}
          GOOGLE_CLIENT_ID: ${{ secrets.APP_GOOGLE_CLIENT_ID }}
          BACKEND_URL: ${{ secrets.APP_BACKEND_URL }}
        run: |
          echo "ENABLE_LOGS=$ENABLE_LOGS" > .env
          echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" >> .env
          echo "BACKEND_URL=$BACKEND_URL" >> .env
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [ -z "$VERSION" ]; then
            echo "Error: Could not extract version from pubspec.yaml"
            exit 1
          fi
          echo "VERSION=$VERSION" >> .env



      # 5. Decode Keystore file
      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/app/upload-keystore.jks

      # 6. Recreate key.properties file
      - name: Create key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" > app/android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> app/android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> app/android/key.properties
          echo "storeFile=upload-keystore.jks" >> app/android/key.properties

      # 7. Fetch Flutter dependencies
      - name: Install dependencies
        working-directory: ./app
        run: flutter pub get

      # 8. Build Release AppBundle
      - name: Build Android AppBundle
        working-directory: ./app
        run: flutter build appbundle --release

      # 9. Upload AAB as workflow artifact
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab

      # 10. Deploy to Google Play Console (Internal Track)
      - name: Deploy to Google Play Internal Testing
        uses: KevinRohn/github-action-upload-play-store@v1.0.2
        with:
          service_account_json: ${{ secrets.PLAY_STORE_CREDENTIALS }}
          package_name: com.xicra.bookscout
          aab_file_path: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          release_status: completed
